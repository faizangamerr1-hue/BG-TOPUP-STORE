<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Dark Hexagon Frame -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="#090d16" stroke="#dc2626" stroke-width="8" />

  <!-- Accent Circle Glow -->
  <circle cx="256" cy="256" r="160" fill="#dc2626" opacity="0.25" filter="url(#glow)" />

  <!-- Shield Shape -->
  <polygon points="256,90 390,165 390,320 256,410 122,320 122,165" fill="#111827" stroke="#ef4444" stroke-width="6" />

  <!-- BG Text Lettermark -->
  <text x="256" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="url(#metalGrad)" text-anchor="middle" letter-spacing="-6" filter="url(#glow)">
    BG
  </text>

  <!-- Subtitle TOP UP -->
  <text x="256" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="8">
    TOPUP
  </text>
</svg>
